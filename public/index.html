function refreshInventoryTable(){const node=document.getElementById('inventoryTable');if(!node)return;node.innerHTML=tb(['Item','Type','Available','Min. stock','Unit cost','Status'],db.items.filter(i=>(filter==='All'||i.category===filter)&&(i.name+' '+i.id).toLowerCase().includes(search.toLowerCase())).map(i=>`<tr><td><strong>${esc(i.name)}</strong><small>${i.id}</small></td><td>${badge(i)}</td><td>${fmt(i.stock)} ${esc(i.unit)}</td><td>${fmt(i.min)} ${esc(i.unit)}</td><td>${peso(i.cost)}</td><td>${i.stock<i.min?'<span class="flag low">Below minimum</span>':'<span class="flag good">In stock</span>'}</td></tr>`).join(''))}

function purchasing(){return h('Purchasing & receiving','Log purchases and deliveries with supplier-specific prices.',btn('Go to price comparison',"go('suppliers')"))+`<div class="layout2">${panel('Receive a delivery','Accepted quantities are added to inventory immediately in this demo.',`<div class="panelbody"><div class="formgrid"><div class="full"><label>Supplier</label><select id="buySupplier" onchange="syncPurchasePrice()">${opts(db.suppliers,s=>s.id,s=>s.name)}</select></div><div class="full"><label>Received item</label><select id="buyItem" onchange="syncPurchasePrice()">${opts(db.items,i=>i.id,i=>i.name+' ('+i.unit+')')}</select></div><div><label>Quantity received</label><input type="number" min="0.01" step="0.01" id="buyQty" placeholder="0.00" oninput="calcPurchase()"></div><div><label>Purchase cost per unit</label><input type="number" min="0.01" step="0.01" id="buyCost" placeholder="0.00" oninput="calcPurchase()"></div><div class="full"><label>Reference (delivery / invoice)</label><input type="text" maxlength="60" id="buyRef" placeholder="e.g. DR-1001"></div></div><div class="callout">Estimated purchase total: <strong id="buyTotal">₱0.00</strong><br><span class="muted">Saving this receipt also stores a dated cost record and a stock movement.</span></div><div class="formfoot">${btn('Confirm receipt','receive()','primary')}</div></div>`)}${panel('Suggested purchasing workflow','A practical starting point for Edna’s.',`<div class="panelbody"><div class="stepper"><span class="step on">01 Check stock</span><span class="step on">02 Compare suppliers</span><span class="step on">03 Receive delivery</span><span class="step on">04 Update inventory</span></div><div class="minirows"><div class="miniro"><div class="miniavatar">🔍</div><div><b>Check what needs replenishment</b><small>Use the low-stock list before buying.</small></div></div><div class="miniro"><div class="miniavatar">₱</div><div><b>Compare dated supplier prices</b><small>Review prior costs and the latest e  if(has)items.forEach((record,k)=>{

   let cells=record.map((v,j)=>{

   rows.push(`<row r="${r}" ht="22" customHeight="1">${cells}</row>`);
 });
 if(!has)rows.push(`<row r="10">${reportCell('No records found','A10',3)}</row>`);
 let cols=def.headers.map((h,j)=>`<col min="${j+1}" max="${j+1}" width="${Math.max(12,Math.min(40,Math.max(h.length+4,(def.widths||[])[j]||18)))}" customWidth="1"/>`).join('');
 let merges=[1,2,3,5,7].map(r=>merge(r,'A',last)).join('');
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="9" topLeftCell="A10" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A10" sqref="A10"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="17"/><cols>${cols}</cols><sheetData>${rows.join('')}</sheetData><autoFilter ref="A9:${last}${Math.max(10,items.length+9)}"/><mergeCells count="5">${merges}</mergeCells><pageMargins left="0.35" right="0.35" top="0.5" bottom="0.5" header="0.2" footer="0.2"/><pageSetup orientation="landscape" fitToWidth="1"/></worksheet>`
}

function reportCRC(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c&1)?(c>>>1)^0xedb88320:c>>>1}return(c^0xffffffff)>>>0}
function reportZip(files){
 const enc=new TextEncoder(),parts=[],directory=[];let offset=0;
 function writeU16(dv,at,v){dv.setUint16(at,v,true)}function writeU32(dv,at,v){dv.setUint32(at,v,true)}
 for(const [path,contents] of files){const name=enc.encode(path),data=enc.encode(contents),crc=reportCRC(data),head=new Uint8Array(30+name.length),v=new DataView(head.buffer);writeU32(v,0,0x04034b50);writeU16(v,4,20);writeU16(v,6,0x800);writeU16(v,8,0);writeU32(v,14,crc);writeU32(v,18,data.length);writeU32(v,22,data.length);writeU16(v,26,name.length);head.set(name,30);parts.push(head,data);const rec=new Uint8Array(46+name.length),rv=new DataView(rec.buffer);writeU32(rv,0,0x02014b50);writeU16(rv,4,20);writeU16(rv,6,20);writeU16(rv,8,0x800);writeU16(rv,10,0);writeU32(rv,16,crc);writeU32(rv,20,data.length);writeU32(rv,24,data.length);writeU16(rv,28,name.length);writeU32(rv,42,offset);rec.set(name,46);directory.push(rec);offset+=head.length+data.length;}
 const end=new Uint8Array(22),ev=new DataView(end.buffer),dirSize=directory.reduce((a,v)=>a+v.length,0);writeU32(ev,0,0x06054b50);writeU16(ev,8,directory.length);writeU16(ev,10,directory.length);writeU32(ev,12,dirSize);writeU32(ev,16,offset);return new Blob([...parts,...directory,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
